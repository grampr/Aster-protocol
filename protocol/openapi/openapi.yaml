openapi: 3.1.1
info:
  title: Aster REST API
  version: 0.1.0
  summary: Aster Client、Bot、Webhook が利用する REST API
  description: |
    Aster の永続状態を取得し、明示的な変更を要求するための API です。
    リアルタイムな変更通知は WebSocket Gateway が担当します。
  license:
    name: Apache License 2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1
    description: 接続先インスタンスの Version 1 API

tags:
  - name: Authentication
    description: Aster Session の作成、更新、破棄を行う Operation
  - name: Users
    description: 認証済み User 自身を扱う Operation
  - name: Guilds
    description: User が参加する Guild とその設定を扱う Operation
  - name: Channels
    description: Guild 内の Text Channel と Voice Channel を扱う Operation
  - name: Messages
    description: Text Channel 内の Message を扱う Operation
  - name: System
    description: Instance の稼働状態を確認する Operation

paths:
  /auth/password/register:
    $ref: ./paths/auth/password-register.yaml
  /auth/password/login:
    $ref: ./paths/auth/password-login.yaml
  /auth/google/authorize:
    $ref: ./paths/auth/google-authorization.yaml
  /auth/google/callback:
    $ref: ./paths/auth/google-callback.yaml
  /auth/google/exchange:
    $ref: ./paths/auth/google-exchange.yaml
  /auth/token/refresh:
    $ref: ./paths/auth/token-refresh.yaml
  /auth/logout:
    $ref: ./paths/auth/logout.yaml
  /users/@me:
    $ref: ./paths/users/me.yaml
  /guilds:
    $ref: ./paths/guilds/guilds.yaml
  /guilds/{guild_id}:
    $ref: ./paths/guilds/guild.yaml
  /guilds/{guild_id}/channels:
    $ref: ./paths/guilds/channels.yaml
  /channels/{channel_id}:
    $ref: ./paths/channels/channel.yaml
  /channels/{channel_id}/messages:
    $ref: ./paths/channels/messages.yaml
  /channels/{channel_id}/messages/{message_id}:
    $ref: ./paths/messages/message.yaml
  /health:
    $ref: ./paths/system/health.yaml

