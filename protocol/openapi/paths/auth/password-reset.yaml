post:
  operationId: resetPassword
  tags:
    - Authentication
  summary: Tokenを使ってPasswordを再設定する
  description: |
    新しいPasswordを設定し、そのUserの全てのAster Sessionを破棄します。
    TokenでEmail Addressの所有を確認できたため、`email_verified`も`true`になります。
    Tokenは一度だけ使用でき、成功・失敗を問わず再利用できません。
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/ResetPasswordRequest.yaml
  responses:
    "204":
      description: Passwordを再設定し、既存のSessionを破棄しました。
      headers:
        X-Request-ID:
          $ref: ../../components/headers/RequestId.yaml
    "400":
      description: Tokenが無効、失効済み、使用済み、または新しいPasswordが要件を満たしません。
      headers:
        X-Request-ID:
          $ref: ../../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/Error.yaml
          example:
            code: INVALID_RESET_TOKEN
            message: Reset token is invalid or expired
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    "429":
      $ref: ../../components/responses/RateLimited.yaml
    default:
      $ref: ../../components/responses/Error.yaml
