post:
  operationId: refreshSession
  tags:
    - Authentication
  summary: Refresh Token を使用して Session を更新する
  description: |
    成功時は新しい Access Token と Refresh Token を発行し、使用済みの Refresh Token を無効化します。
    使用済み Token の再利用を検知した場合は、同じ Session の Token Family を無効化できます。
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/RefreshSessionRequest.yaml
        example:
          refresh_token: example-refresh-token
  responses:
    "200":
      description: Aster Session を更新しました。
      headers:
        X-Request-ID:
          $ref: ../../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/SessionTokenResponse.yaml
          example:
            access_token: example-next-access-token
            refresh_token: example-next-refresh-token
            token_type: Bearer
            expires_in: 900
            refresh_expires_in: 2592000
            session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    "401":
      $ref: ../../components/responses/InvalidRefreshToken.yaml
    "429":
      $ref: ../../components/responses/RateLimited.yaml
    default:
      $ref: ../../components/responses/Error.yaml
