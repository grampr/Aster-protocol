post:
  operationId: registerWithPassword
  tags:
    - Authentication
  summary: Password を使用して User Account と Session を作成する
  description: |
    Email Address が登録済みの場合は新しい Account を作成しません。
    作成した Account の Email 所有確認は、別途定義する Verification Flow で行います。
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/RegisterPasswordRequest.yaml
        example:
          email: alice@example.com
          password: <password-with-15-or-more-characters>
          display_name: Alice
  responses:
    "201":
      description: User Account と Aster Session を作成しました。
      headers:
        X-Request-ID:
          $ref: ../../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/SessionTokenResponse.yaml
          example:
            access_token: example-access-token
            refresh_token: example-refresh-token
            token_type: Bearer
            expires_in: 900
            refresh_expires_in: 2592000
            session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    "409":
      $ref: ../../components/responses/EmailAlreadyRegistered.yaml
    "429":
      $ref: ../../components/responses/RateLimited.yaml
    default:
      $ref: ../../components/responses/Error.yaml
