post:
  operationId: createPasswordSession
  tags:
    - Authentication
  summary: Email Address と Password で Session を作成する
  description: |
    Account の存在を推測できないよう、Email Address と Password のどちらが一致しない場合も
    同じ `INVALID_CREDENTIALS` Error を返します。
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/LoginPasswordRequest.yaml
        example:
          email: alice@example.com
          password: <password-with-15-or-more-characters>
  responses:
    "200":
      description: Aster Session を作成しました。
      headers:
        X-Request-ID:
          $ref: ../../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/SessionTokenResponse.yaml
          example:
            access_token: example-access-token
            refresh_token: example-refresh-token
            token_type: Bearer
            expires_in: 900
            refresh_expires_in: 2592000
            session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    "401":
      $ref: ../../components/responses/InvalidCredentials.yaml
    "429":
      $ref: ../../components/responses/RateLimited.yaml
    default:
      $ref: ../../components/responses/Error.yaml
