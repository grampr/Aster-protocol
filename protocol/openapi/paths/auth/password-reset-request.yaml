post:
  operationId: requestPasswordReset
  tags:
    - Authentication
  summary: Password再設定Emailを送る
  description: |
    Password認証を持つAccountのEmail Addressへ、1時間有効な再設定Tokenを送ります。
    Accountの存在を推測できないよう、Accountがない場合やPassword認証がない場合も同じ`202`を返し、
    応答時間も変わらないようにEmailは非同期で送ります。
    新しいTokenを送ると、以前の未使用Tokenは無効になります。
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/RequestPasswordResetRequest.yaml
  responses:
    "202":
      description: 条件に合うAccountがあればEmailを送ります。Response Bodyはありません。
      headers:
        X-Request-ID:
          $ref: ../../components/headers/RequestId.yaml
    "429":
      $ref: ../../components/responses/RateLimited.yaml
    "503":
      $ref: ../../components/responses/MailUnavailable.yaml
    default:
      $ref: ../../components/responses/Error.yaml
