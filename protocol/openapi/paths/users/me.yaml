get:
  operationId: getCurrentUser
  tags:
    - Users
  summary: 認証済み User 自身の Account 情報を取得する
  description: |
    Bearer Access Token が示す User の公開 Profile と認証状態を返します。
    外部 Provider の Subject や Token は返しません。
  security:
    - BearerAuth: []
  responses:
    "200":
      description: 認証済み User の Account 情報です。
      headers:
        X-Request-ID:
          $ref: ../../components/headers/RequestId.yaml
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/users/UserSelf.yaml
          example:
            id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
            email: alice@example.com
            email_verified: false
            display_name: Alice
            avatar_url: null
            authentication_methods:
              - PASSWORD
            created_at: 2026-08-17T06:00:00Z
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "429":
      $ref: ../../components/responses/RateLimited.yaml
    default:
      $ref: ../../components/responses/Error.yaml
