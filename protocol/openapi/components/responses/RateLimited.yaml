description: Rate Limit を超えたため Request を処理しませんでした。
headers:
  Retry-After:
    $ref: ../headers/RetryAfter.yaml
  X-RateLimit-Limit:
    $ref: ../headers/RateLimitLimit.yaml
  X-RateLimit-Remaining:
    $ref: ../headers/RateLimitRemaining.yaml
  X-RateLimit-Reset:
    $ref: ../headers/RateLimitReset.yaml
  X-RateLimit-Bucket:
    $ref: ../headers/RateLimitBucket.yaml
  X-Request-ID:
    $ref: ../headers/RequestId.yaml
content:
  application/json:
    schema:
      $ref: ../schemas/common/RateLimitError.yaml
    example:
      code: RATE_LIMITED
      message: Too many requests
      request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
      details:
        retry_after_ms: 1250
