title: Invite
description: Guildへ参加するための期限と利用回数を持つ招待です。
type: object
additionalProperties: false
required:
  - id
  - code
  - guild
  - inviter
  - uses
  - max_uses
  - expires_at
  - created_at
properties:
  id:
    $ref: ../common/UUID.yaml
  code:
    type: string
    pattern: "^[A-Za-z0-9_-]{16,64}$"
  guild:
    $ref: ../guilds/Guild.yaml
  inviter:
    $ref: ../users/UserSummary.yaml
  uses:
    type: integer
    minimum: 0
  max_uses:
    oneOf:
      - type: integer
        minimum: 1
      - type: "null"
  expires_at:
    oneOf:
      - $ref: ../common/Timestamp.yaml
      - type: "null"
  created_at:
    $ref: ../common/Timestamp.yaml
