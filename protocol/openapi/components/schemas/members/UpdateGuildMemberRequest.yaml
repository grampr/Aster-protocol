title: UpdateGuildMemberRequest
description: Guild内のNicknameまたは割り当てるRoleを変更します。
type: object
additionalProperties: false
minProperties: 1
properties:
  nickname:
    oneOf:
      - type: string
        minLength: 1
        maxLength: 64
      - type: "null"
  role_ids:
    type: array
    maxItems: 100
    uniqueItems: true
    items:
      $ref: ../common/UUID.yaml
