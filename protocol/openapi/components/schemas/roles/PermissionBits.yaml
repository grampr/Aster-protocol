title: PermissionBits
description: |
  GuildとChannelで許可する操作を表す32-bit Bitfieldです。
  初期割り当ては次のとおりです。

  - `1 << 0` VIEW_CHANNEL
  - `1 << 1` SEND_MESSAGES
  - `1 << 2` MANAGE_MESSAGES
  - `1 << 3` MANAGE_CHANNELS
  - `1 << 4` MANAGE_GUILD
  - `1 << 5` MANAGE_ROLES
  - `1 << 6` MANAGE_MEMBERS
  - `1 << 7` CREATE_INVITE
  - `1 << 8` CONNECT
  - `1 << 9` SPEAK
  - `1 << 10` STREAM
type: integer
format: int64
minimum: 0
maximum: 2147483647
