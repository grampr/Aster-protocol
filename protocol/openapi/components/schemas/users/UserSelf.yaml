title: UserSelf
description: 認証済み User 自身にだけ返す Account 情報です。
type: object
additionalProperties: false
required:
  - id
  - email
  - email_verified
  - display_name
  - avatar_url
  - authentication_methods
  - created_at
properties:
  id:
    $ref: ../common/UUID.yaml
  email:
    $ref: ../auth/Email.yaml
  email_verified:
    type: boolean
    description: Email Address の所有確認が完了している場合は true です。
  display_name:
    type: string
    minLength: 1
    maxLength: 64
  avatar_url:
    description: Avatar Image の URL です。未設定の場合は null です。
    oneOf:
      - type: string
        format: uri
      - type: "null"
  authentication_methods:
    type: array
    description: Account に Link されている認証方法です。
    minItems: 1
    uniqueItems: true
    items:
      $ref: ../auth/AuthenticationMethod.yaml
  created_at:
    $ref: ../common/Timestamp.yaml
examples:
  - id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    email: alice@example.com
    email_verified: false
    display_name: Alice
    avatar_url: null
    authentication_methods:
      - PASSWORD
    created_at: 2026-08-17T06:00:00Z
