title: Message
description: Text Channelに投稿されたMessageです。
type: object
additionalProperties: false
required:
  - id
  - channel_id
  - author
  - content
  - reply_to_message_id
  - reply_to
  - reactions
  - attachments
  - created_at
  - edited_at
properties:
  id:
    $ref: ../common/UUID.yaml
  channel_id:
    allOf:
      - $ref: ../common/UUID.yaml
    description: Messageが属するText Channel IDです。
  author:
    $ref: ../users/UserSummary.yaml
  content:
    type: string
    maxLength: 4000
    description: UTF-8のMessage本文です。AttachmentのみのMessageでは空文字列です。
  reply_to_message_id:
    description: |
      返信元Message IDです。通常のMessageではnullです。
      返信元が削除済みまたは参照不能でも、返信関係を示すためIDは保持します。
    oneOf:
      - $ref: ../common/UUID.yaml
      - type: "null"
  reply_to:
    description: |
      表示可能な返信元Messageです。通常のMessage、削除済み、または参照不能の場合はnullです。
      reply_to_message_idがnullでなく、このFieldがnullの場合、Clientは返信元を表示できない状態として扱います。
    oneOf:
      - $ref: ./MessageReply.yaml
      - type: "null"
  reactions:
    type: array
    description: 絵文字ごとのReaction集計です。Reactionがない場合は空配列です。
    items:
      $ref: ./MessageReaction.yaml
  attachments:
    type: array
    description: Messageへ紐付いたREADY状態のAttachmentです。
    items:
      $ref: ../media/Attachment.yaml
  created_at:
    $ref: ../common/Timestamp.yaml
  edited_at:
    description: 最後に本文を編集した時刻です。未編集の場合はnullです。
    oneOf:
      - $ref: ../common/Timestamp.yaml
      - type: "null"
examples:
  - id: 0198b8f2-4f80-7e67-b250-b4051415e3c2
    channel_id: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
    author:
      id: 0198b8ef-1c5d-7b34-892e-81d2e1e2b090
      display_name: Alice
      avatar_url: https://cdn.example.com/avatars/alice.png
    content: 10月24日で進める方向でよいでしょうか？
    reply_to_message_id: 0198b8f0-1b72-73a2-a2ef-75cf3cd276d8
    reply_to:
      id: 0198b8f0-1b72-73a2-a2ef-75cf3cd276d8
      channel_id: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
      author:
        id: 0198b8ed-7ba1-7165-b028-9ecf14ed1e7b
        display_name: Bob
        avatar_url: null
      content: 10月24日で進めませんか？
      created_at: 2026-08-17T06:10:00Z
      edited_at: null
    reactions:
      - emoji: 👍
        count: 3
        me: true
    attachments: []
    created_at: 2026-08-17T06:12:00Z
    edited_at: null
