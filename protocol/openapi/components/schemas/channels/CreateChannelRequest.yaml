title: CreateChannelRequest
description: Guild内に新しいChannelを作成するときの設定です。
type: object
additionalProperties: false
required:
  - type
  - name
properties:
  type:
    type: string
    enum: [TEXT, VOICE, CATEGORY]
  name:
    type: string
    minLength: 1
    maxLength: 100
  topic:
    type: string
    maxLength: 1024
  parent_id:
    $ref: ../common/UUID.yaml
examples:
  - type: TEXT
    name: イベント企画
    topic: 次回イベントの日程と内容を相談します
