title: Channel
description: Guild内のText ChannelまたはVoice Channelです。
type: object
additionalProperties: false
required:
  - id
  - guild_id
  - type
  - name
  - topic
  - position
  - created_at
properties:
  id:
    $ref: ../common/UUID.yaml
  guild_id:
    allOf:
      - $ref: ../common/UUID.yaml
    description: Channelが属するGuild IDです。
  type:
    $ref: ./ChannelType.yaml
  name:
    type: string
    minLength: 1
    maxLength: 100
  topic:
    description: Text Channelの説明です。未設定またはVoice Channelの場合はnullです。
    oneOf:
      - type: string
        maxLength: 1024
      - type: "null"
  position:
    type: integer
    minimum: 0
    description: 同じGuild内での表示順です。小さい値を先に表示します。
  created_at:
    $ref: ../common/Timestamp.yaml
examples:
  - id: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
    guild_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    type: TEXT
    name: イベント企画
    topic: 次回イベントの日程と内容を相談します
    position: 2
    created_at: 2026-08-17T06:05:00Z
