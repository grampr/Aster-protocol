title: RegisterPasswordRequest
description: Password を使用して User Account を作成する Request です。
type: object
additionalProperties: false
required:
  - email
  - password
  - display_name
properties:
  email:
    $ref: ./Email.yaml
  password:
    $ref: ./Password.yaml
  display_name:
    type: string
    description: 他の User に表示する名前です。
    minLength: 1
    maxLength: 64
examples:
  - email: alice@example.com
    password: <password-with-15-or-more-characters>
    display_name: Alice
