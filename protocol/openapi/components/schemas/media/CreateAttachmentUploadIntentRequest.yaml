title: CreateAttachmentUploadIntentRequest
description: ClientからObject Storageへ直接アップロードするファイルの宣言です。
type: object
additionalProperties: false
required:
  - filename
  - content_type
  - size
  - checksum_sha256
properties:
  filename:
    type: string
    minLength: 1
    maxLength: 255
  content_type:
    type: string
    minLength: 3
    maxLength: 255
  size:
    type: integer
    format: int64
    minimum: 1
    maximum: 26214400
  checksum_sha256:
    type: string
    pattern: '^[A-Fa-f0-9]{64}$'

