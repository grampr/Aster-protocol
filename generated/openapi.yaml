openapi: 3.1.1
info:
  title: Aster REST API
  version: 0.1.0
  summary: Aster Client、Bot、Webhook が利用する REST API
  description: |
    Aster の永続状態を取得し、明示的な変更を要求するための API です。
    リアルタイムな変更通知は WebSocket Gateway が担当します。
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: 接続先インスタンスの Version 1 API
tags:
  - name: Authentication
    description: Aster Session の作成、更新、破棄を行う Operation
  - name: Users
    description: 認証済み User 自身を扱う Operation
  - name: System
    description: Instance の稼働状態を確認する Operation
paths:
  /auth/password/register:
    post:
      operationId: registerWithPassword
      tags:
        - Authentication
      summary: Password を使用して User Account と Session を作成する
      description: |
        Email Address が登録済みの場合は新しい Account を作成しません。
        作成した Account の Email 所有確認は、別途定義する Verification Flow で行います。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPasswordRequest'
            example:
              email: alice@example.com
              password: <password-with-15-or-more-characters>
              display_name: Alice
      responses:
        '201':
          description: User Account と Aster Session を作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-access-token
                refresh_token: example-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/password/login:
    post:
      operationId: createPasswordSession
      tags:
        - Authentication
      summary: Email Address と Password で Session を作成する
      description: |
        Account の存在を推測できないよう、Email Address と Password のどちらが一致しない場合も
        同じ `INVALID_CREDENTIALS` Error を返します。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPasswordRequest'
            example:
              email: alice@example.com
              password: <password-with-15-or-more-characters>
      responses:
        '200':
          description: Aster Session を作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-access-token
                refresh_token: example-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/google/authorize:
    post:
      operationId: beginGoogleAuthorization
      tags:
        - Authentication
      summary: Google Loginを開始する
      description: |
        Desktop Clientが生成したPKCE S256 ChallengeとClient Stateを短時間のLogin試行へ保存し、
        System Browserで開くGoogle Authorization URLを返します。
        ServerはGoogle向けのOAuth StateとOpenID Connect Nonceを別に生成し、Clientへ秘密情報を返しません。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthorizationRequest'
            example:
              redirect_uri: aster://auth/callback
              code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
              code_challenge_method: S256
              client_state: yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
      responses:
        '200':
          description: Google Authorization URLを作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthorizationResponse'
              example:
                authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=example&response_type=code
                expires_in: 300
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/google/callback:
    get:
      operationId: completeGoogleAuthorization
      tags:
        - Authentication
      summary: GoogleからのAuthorization Callbackを処理する
      description: |
        Googleが呼び出すServer側Callbackです。ServerはOAuth State、OpenID Connect Nonce、Issuer、
        Audience、署名を検証します。成功時は短時間かつ一度だけ使用できるAster Exchange Codeと、
        Login開始時のClient Stateだけを`aster://auth/callback`へ302 Redirectします。
        GoogleのAuthorization Code、ID Token、Access Token、Refresh TokenはDeep Linkへ含めません。

        Googleが認証を拒否した場合は`error=access_denied`、Provider処理に失敗した場合は
        `error=provider_error`とClient Stateを許可済みDeep Linkへ返します。
        OAuth Stateを検証できないRequestはRedirectせず、400 Errorを返します。
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Googleが発行したAuthorization Codeです。Server内部でのみ交換します。
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: state
          in: query
          required: true
          description: ServerがGoogle Authorization Requestに設定したOAuth Stateです。
          schema:
            type: string
            minLength: 32
            maxLength: 512
        - name: error
          in: query
          required: false
          description: GoogleがAuthorizationを完了できなかった理由です。
          schema:
            type: string
            maxLength: 256
        - name: error_description
          in: query
          required: false
          description: Googleが返す補足情報です。Deep Linkへそのまま転送しません。
          schema:
            type: string
            maxLength: 1024
      responses:
        '302':
          description: 許可済みAster Desktop Deep Linkへ認証結果をRedirectします。
          headers:
            Location:
              required: true
              description: Exchange Codeまたは安全なError CodeとClient Stateを含むAster Deep Linkです。
              schema:
                type: string
                pattern: ^aster://auth/callback\?
              examples:
                success:
                  value: aster://auth/callback?code=example-one-time-aster-exchange-code&state=yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
                denied:
                  value: aster://auth/callback?error=access_denied&state=yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          description: OAuth Stateが無効、失効済み、またはCallback Parameterの組み合わせが不正です。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_OAUTH_CALLBACK
                message: OAuth callback is invalid or expired
                request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        default:
          $ref: '#/components/responses/Error'
  /auth/google/exchange:
    post:
      operationId: exchangeGoogleAuthorization
      tags:
        - Authentication
      summary: Google認証結果をAster Sessionへ交換する
      description: |
        Callback Deep Linkで受け取ったAster Exchange Codeと、Login開始時に生成したPKCE Verifierを交換します。
        Exchange Codeは一度だけ使用でき、成功・失敗を問わず再利用できません。
        GoogleのTokenはServer側に留まり、ResponseはProvider非依存のAster Session Tokenだけを返します。

        Google Identityが未Linkで、同じ確認済みEmail Addressを持つ既存Accountがある場合は自動Linkせず、
        `ACCOUNT_LINK_REQUIRED`を返します。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleExchangeRequest'
            example:
              exchange_code: example-one-time-aster-exchange-code
              code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        '200':
          description: Google Identityを確認し、Aster Sessionを作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-access-token
                refresh_token: example-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '400':
          $ref: '#/components/responses/InvalidAuthorizationGrant'
        '409':
          $ref: '#/components/responses/AccountLinkRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/token/refresh:
    post:
      operationId: refreshSession
      tags:
        - Authentication
      summary: Refresh Token を使用して Session を更新する
      description: |
        成功時は新しい Access Token と Refresh Token を発行し、使用済みの Refresh Token を無効化します。
        使用済み Token の再利用を検知した場合は、同じ Session の Token Family を無効化できます。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            example:
              refresh_token: example-refresh-token
      responses:
        '200':
          description: Aster Session を更新しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-next-access-token
                refresh_token: example-next-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: deleteCurrentSession
      tags:
        - Authentication
      summary: 現在の Aster Session を破棄する
      description: |
        Bearer Access Token が示す Session と、Request の Refresh Token が同じ Session に属する場合に破棄します。
        破棄後は、その Session から派生した Access Token と Refresh Token を再利用できません。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refresh_token: example-refresh-token
      responses:
        '204':
          description: Aster Session を破棄しました。Response Body はありません。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /users/@me:
    get:
      operationId: getCurrentUser
      tags:
        - Users
      summary: 認証済み User 自身の Account 情報を取得する
      description: |
        Bearer Access Token が示す User の公開 Profile と認証状態を返します。
        外部 Provider の Subject や Token は返しません。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 認証済み User の Account 情報です。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
              example:
                id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
                email: alice@example.com
                email_verified: false
                display_name: Alice
                avatar_url: null
                authentication_methods:
                  - PASSWORD
                created_at: '2026-08-17T06:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /health:
    get:
      operationId: getHealth
      tags:
        - System
      summary: Instance の稼働状態を取得する
      description: |
        HTTP Server が Request を処理できる状態か確認します。
        PostgreSQL などの依存サービスを含む Readiness Check は別の Operation で定義します。
      security: []
      responses:
        '200':
          description: HTTP Server は Request を処理できます。
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/RateLimitBucket'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 0.1.0
                time: '2026-08-17T06:00:00Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Aster Server が発行する不透明な Access Token です。
        Google など外部 Provider の Token は指定しません。
  headers:
    RateLimitBucket:
      description: 同じ Rate Limit を共有する Operation 群の不透明な識別子です。
      required: true
      schema:
        type: string
        minLength: 1
      example: channel-message-write
    RateLimitLimit:
      description: 現在の Bucket で許可される Request 数です。
      required: true
      schema:
        type: integer
        minimum: 1
      example: 5
    RateLimitRemaining:
      description: 現在の Window で残っている Request 数です。
      required: true
      schema:
        type: integer
        minimum: 0
      example: 0
    RateLimitReset:
      description: 現在の Window が終了する Unix Timestamp（秒）です。
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1786946402
    RequestId:
      description: Request を追跡するために Server が割り当てた識別子です。
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
      example: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    RetryAfter:
      description: Request を再試行できるまでの秒数です。
      required: true
      schema:
        type: integer
        minimum: 0
      example: 2
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        前の Response が返した次ページ用 Cursor です。
        Cursor は不透明な値として扱い、Client は内容を解析または変更しません。
      schema:
        $ref: '#/components/schemas/PaginationCursor'
      example: eyJpZCI6IjAxOThiOGYwLTJkNmUtN2M0NS05YTNmLTkyZTNmMmYzYzFhMCJ9
    Limit:
      name: limit
      in: query
      required: false
      description: 1回の Response で取得する最大件数です。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50
  responses:
    EmailAlreadyRegistered:
      description: 指定された Email Address は登録済みです。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: EMAIL_ALREADY_REGISTERED
            message: Email is already registered
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    AccountLinkRequired:
      description: 確認済みEmail Addressが既存Accountで使用されているため、自動Linkや新規Account作成を行いませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ACCOUNT_LINK_REQUIRED
            message: Sign in to the existing account before linking Google
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    Error:
      description: Request を完了できませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Internal server error
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    InvalidCredentials:
      description: Email Address または Password が一致しないため Session を作成しませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_CREDENTIALS
            message: Email or password is incorrect
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    InvalidAuthorizationGrant:
      description: Exchange Codeが無効、失効済み、使用済み、またはPKCE検証に失敗したためSessionを作成しませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_AUTHORIZATION_GRANT
            message: Authorization grant is invalid or expired
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    InvalidRefreshToken:
      description: Refresh Token が無効または失効済みのため Session を更新しませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REFRESH_TOKEN
            message: Refresh token is invalid or expired
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    RateLimited:
      description: Rate Limit を超えたため Request を処理しませんでした。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Bucket:
          $ref: '#/components/headers/RateLimitBucket'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            code: RATE_LIMITED
            message: Too many requests
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
            details:
              retry_after_ms: 1250
    Unauthorized:
      description: 有効な Aster Access Token がないため Request を認可しませんでした。
      headers:
        WWW-Authenticate:
          description: Bearer 認証が必要であることを示します。
          schema:
            type: string
          example: Bearer
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication is required
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
  schemas:
    AccessToken:
      title: AccessToken
      description: Aster API の認可に使用する、短時間有効な不透明 Token です。
      type: string
      minLength: 1
      maxLength: 4096
      examples:
        - example-access-token
    AuthenticationMethod:
      title: AuthenticationMethod
      description: User Account に Link された認証方法です。
      type: string
      enum:
        - PASSWORD
        - GOOGLE
      x-enum-varnames:
        - Password
        - Google
      examples:
        - PASSWORD
    Email:
      title: Email
      description: Login と通知に使用する Email Address です。比較時の正規化は Server が行います。
      type: string
      format: email
      maxLength: 320
      examples:
        - alice@example.com
    AsterExchangeCode:
      title: AsterExchangeCode
      description: Google認証後にAster Serverが発行する、短時間かつ一度だけ使用できる不透明なCodeです。
      type: string
      minLength: 32
      maxLength: 512
      examples:
        - example-one-time-aster-exchange-code
    Error:
      title: Error
      description: API Error の共通形式です。
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          description: Client が分岐に利用する機械可読な Error Code です。
          pattern: ^[A-Z][A-Z0-9_]*$
          examples:
            - INTERNAL_ERROR
        message:
          type: string
          description: 開発者が原因を把握するための説明です。
          minLength: 1
          examples:
            - Internal server error
        request_id:
          $ref: '#/components/schemas/RequestId'
        details:
          type: object
          description: Error Code ごとに定義される追加情報です。
          additionalProperties: true
    HealthResponse:
      title: HealthResponse
      description: HTTP Server の稼働状態です。
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - time
      properties:
        status:
          type: string
          const: ok
          description: HTTP Server が稼働している場合は `ok` です。
        version:
          type: string
          description: 稼働中の Aster Server Version です。
          minLength: 1
          examples:
            - 0.1.0
        time:
          $ref: '#/components/schemas/Timestamp'
    GoogleAuthorizationRequest:
      title: GoogleAuthorizationRequest
      description: Google Loginを開始するDesktop ClientのPKCE情報です。
      type: object
      additionalProperties: false
      required:
        - redirect_uri
        - code_challenge
        - code_challenge_method
        - client_state
      properties:
        redirect_uri:
          type: string
          format: uri
          const: aster://auth/callback
          description: 許可されたAster DesktopのDeep Linkです。任意のRedirect URIは受け付けません。
        code_challenge:
          $ref: '#/components/schemas/PkceCodeChallenge'
        code_challenge_method:
          type: string
          const: S256
          description: Aster Desktopが使用できるPKCE変換方式です。
        client_state:
          $ref: '#/components/schemas/OAuthClientState'
      examples:
        - redirect_uri: aster://auth/callback
          code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
          code_challenge_method: S256
          client_state: yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
    GoogleAuthorizationResponse:
      title: GoogleAuthorizationResponse
      description: System Browserで開くGoogle Authorization URLです。
      type: object
      additionalProperties: false
      required:
        - authorization_url
        - expires_in
      properties:
        authorization_url:
          type: string
          format: uri
          description: ServerがOAuth StateとOpenID Connect Nonceを組み込んだGoogle Authorization URLです。
        expires_in:
          type: integer
          minimum: 1
          maximum: 600
          description: Login試行が失効するまでの秒数です。
      examples:
        - authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=example&response_type=code
          expires_in: 300
    GoogleExchangeRequest:
      title: GoogleExchangeRequest
      description: 一度限りのAster Exchange CodeをProvider非依存のAster Sessionへ交換します。
      type: object
      additionalProperties: false
      required:
        - exchange_code
        - code_verifier
      properties:
        exchange_code:
          $ref: '#/components/schemas/AsterExchangeCode'
        code_verifier:
          $ref: '#/components/schemas/PkceCodeVerifier'
      examples:
        - exchange_code: example-one-time-aster-exchange-code
          code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    LoginPasswordRequest:
      title: LoginPasswordRequest
      description: Email Address と Password で Aster Session を作成する Request です。
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
      examples:
        - email: alice@example.com
          password: <password-with-15-or-more-characters>
    LogoutRequest:
      title: LogoutRequest
      description: 破棄する Aster Session の Refresh Token を指定する Request です。
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
      examples:
        - refresh_token: example-refresh-token
    PageInfo:
      title: PageInfo
      description: Cursor Pagination の継続情報です。
      type: object
      additionalProperties: false
      required:
        - has_more
        - next_cursor
      properties:
        has_more:
          type: boolean
          description: 現在の Page より後に取得可能な項目がある場合は true です。
        next_cursor:
          description: 次の Page を取得するときに渡す Cursor です。次がない場合は null です。
          oneOf:
            - $ref: '#/components/schemas/PaginationCursor'
            - type: 'null'
      examples:
        - has_more: true
          next_cursor: eyJpZCI6IjAxOThiOGYwLTJkNmUtN2M0NS05YTNmLTkyZTNmMmYzYzFhMCJ9
    PaginationCursor:
      title: PaginationCursor
      description: 次の取得位置を表す、Server が発行した不透明な Cursor です。
      type: string
      minLength: 1
      maxLength: 512
      examples:
        - eyJpZCI6IjAxOThiOGYwLTJkNmUtN2M0NS05YTNmLTkyZTNmMmYzYzFhMCJ9
    Password:
      title: Password
      description: |
        User が設定する Password です。空白を含む Unicode 文字列を許可します。
        Client は文字種の組み合わせを強制せず、Server は漏えい Password を拒否できます。
      type: string
      minLength: 15
      maxLength: 128
      examples:
        - <password-with-15-or-more-characters>
    PkceCodeChallenge:
      title: PkceCodeChallenge
      description: PKCE S256でCode Verifierから生成した、PaddingなしのBase64url値です。
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      examples:
        - E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
    PkceCodeVerifier:
      title: PkceCodeVerifier
      description: RFC 7636のUnreserved Characterだけで構成するPKCE Code Verifierです。
      type: string
      minLength: 43
      maxLength: 128
      pattern: ^[A-Za-z0-9._~-]+$
      examples:
        - dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    OAuthClientState:
      title: OAuthClientState
      description: Desktop ClientがLogin開始とDeep Link Callbackを照合するために生成する不透明な値です。
      type: string
      minLength: 43
      maxLength: 128
      pattern: ^[A-Za-z0-9._~-]+$
      examples:
        - yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
    RateLimitDetails:
      title: RateLimitDetails
      description: Rate Limit Error に固有の再試行情報です。
      type: object
      additionalProperties: false
      required:
        - retry_after_ms
      properties:
        retry_after_ms:
          type: integer
          minimum: 0
          description: Request を再試行できるまでのミリ秒数です。
          examples:
            - 1250
    RateLimitError:
      title: RateLimitError
      description: Rate Limit を超えた Request に返す Error です。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - details
          properties:
            code:
              type: string
              const: RATE_LIMITED
              x-enum-varnames:
                - RateLimited
              description: Rate Limit Error を表す固定 Code です。
            details:
              $ref: '#/components/schemas/RateLimitDetails'
    RequestId:
      title: RequestId
      description: Request と Log を対応づける UUID です。
      type: string
      format: uuid
      examples:
        - 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    RefreshSessionRequest:
      title: RefreshSessionRequest
      description: Refresh Token を Rotation して Aster Session を更新する Request です。
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
      examples:
        - refresh_token: example-refresh-token
    RefreshToken:
      title: RefreshToken
      description: Aster Session を更新するための、一度だけ使用できる不透明 Token です。
      type: string
      minLength: 1
      maxLength: 4096
      examples:
        - example-refresh-token
    RegisterPasswordRequest:
      title: RegisterPasswordRequest
      description: Password を使用して User Account を作成する Request です。
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - display_name
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        display_name:
          type: string
          description: 他の User に表示する名前です。
          minLength: 1
          maxLength: 64
      examples:
        - email: alice@example.com
          password: <password-with-15-or-more-characters>
          display_name: Alice
    SessionTokenResponse:
      title: SessionTokenResponse
      description: 認証方法に依存しない Aster Session の Token 一式です。
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - refresh_expires_in
        - session_id
      properties:
        access_token:
          $ref: '#/components/schemas/AccessToken'
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
        token_type:
          type: string
          const: Bearer
          description: Authorization Header で使用する Token Type です。
        expires_in:
          type: integer
          minimum: 1
          description: Access Token が失効するまでの秒数です。
        refresh_expires_in:
          type: integer
          minimum: 1
          description: Refresh Token が失効するまでの秒数です。
        session_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Client が Session を識別するための ID です。
      examples:
        - access_token: example-access-token
          refresh_token: example-refresh-token
          token_type: Bearer
          expires_in: 900
          refresh_expires_in: 2592000
          session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    Timestamp:
      title: Timestamp
      description: UTC の ISO 8601 Timestamp です。
      type: string
      format: date-time
      examples:
        - '2026-08-17T06:00:00Z'
    UUID:
      title: UUID
      description: UUIDv7 を使用する Resource Identifier です。
      type: string
      format: uuid
      examples:
        - 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    UserSelf:
      title: UserSelf
      description: 認証済み User 自身にだけ返す Account 情報です。
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - email_verified
        - display_name
        - avatar_url
        - authentication_methods
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          $ref: '#/components/schemas/Email'
        email_verified:
          type: boolean
          description: Email Address の所有確認が完了している場合は true です。
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        avatar_url:
          description: Avatar Image の URL です。未設定の場合は null です。
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        authentication_methods:
          type: array
          description: Account に Link されている認証方法です。
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthenticationMethod'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
          email: alice@example.com
          email_verified: false
          display_name: Alice
          avatar_url: null
          authentication_methods:
            - PASSWORD
          created_at: '2026-08-17T06:00:00Z'
