        - count
        - me
      properties:
        emoji:
          $ref: '#/components/schemas/ReactionEmoji'
        count:
          type: integer
          minimum: 0
          description: Operation完了後にこの絵文字が付いている件数です。解除Responseでは0になる場合があります。
        me:
          type: boolean
          description: 認証済みUser自身がこのReactionを付けている場合はtrueです。
      example:
        emoji: 👍
        count: 3
        me: true
    MessageList:
      title: MessageList
