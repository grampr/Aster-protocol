    Message:
      title: Message
      description: Text Channelに投稿されたMessageです。
      type: object
      additionalProperties: false
      required:
        - id
        - channel_id
        - author
        - content
        - reply_to_message_id
        - reply_to
        - reactions
        - created_at
        - edited_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        channel_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Messageが属するText Channel IDです。
        author:
          $ref: '#/components/schemas/UserSummary'
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: UTF-8のMessage本文です。
        reply_to_message_id:
          description: |
            返信元Message IDです。通常のMessageではnullです。
            返信元が削除済みまたは参照不能でも、返信関係を示すためIDは保持します。
          oneOf:
            - $ref: '#/components/schemas/UUID'
            - type: 'null'
        reply_to:
          description: |
            表示可能な返信元Messageです。通常のMessage、削除済み、または参照不能の場合はnullです。
            reply_to_message_idがnullでなく、このFieldがnullの場合、Clientは返信元を表示できない状態として扱います。
          oneOf:
            - $ref: '#/components/schemas/MessageReply'
            - type: 'null'
        reactions:
          type: array
          description: 絵文字ごとのReaction集計です。Reactionがない場合は空配列です。
          items:
            $ref: '#/components/schemas/MessageReaction'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        edited_at:
          description: 最後に本文を編集した時刻です。未編集の場合はnullです。
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
      examples:
        - id: 0198b8f2-4f80-7e67-b250-b4051415e3c2
          channel_id: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
          author:
            id: 0198b8ef-1c5d-7b34-892e-81d2e1e2b090
            display_name: Alice
            avatar_url: https://cdn.example.com/avatars/alice.png
          content: 10月24日で進める方向でよいでしょうか？
          reply_to_message_id: 0198b8f0-1b72-73a2-a2ef-75cf3cd276d8
          reply_to:
            id: 0198b8f0-1b72-73a2-a2ef-75cf3cd276d8
            channel_id: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
            author:
              id: 0198b8ed-7ba1-7165-b028-9ecf14ed1e7b
              display_name: Bob
              avatar_url: null
            content: 10月24日で進めませんか？
            created_at: '2026-08-17T06:10:00Z'
            edited_at: null
          reactions:
            - emoji: 👍
              count: 3
              me: true
          created_at: '2026-08-17T06:12:00Z'
          edited_at: null
    MessageReply:
      title: MessageReply
      description: |
        返信元Messageを表示するための軽量な参照です。
        再帰的なMessage構造を避けるため、返信元自身のreply_toは含みません。
      type: object
      additionalProperties: false
      required:
        - id
        - channel_id
        - author
        - content
        - created_at
        - edited_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        channel_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: 返信元Messageが属するText Channel IDです。
        author:
          $ref: '#/components/schemas/UserSummary'
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: 返信元MessageのUTF-8本文です。
        created_at:
          $ref: '#/components/schemas/Timestamp'
        edited_at:
          description: 返信元Messageを最後に編集した時刻です。未編集の場合はnullです。
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MessageReaction:
      title: MessageReaction
      description: Messageに付いた同じ絵文字のReaction集計です。Message内ではcountが1以上の項目だけを返します。
      type: object
      additionalProperties: false
      required:
