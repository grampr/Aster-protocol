openapi: 3.1.1
info:
  title: Aster REST API
  version: 0.1.0
  summary: Aster Client、Bot、Webhook が利用する REST API
  description: |
    Aster の永続状態を取得し、明示的な変更を要求するための API です。
    リアルタイムな変更通知は WebSocket Gateway が担当します。
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: 接続先インスタンスの Version 1 API
tags:
  - name: Authentication
    description: Aster Session の作成、更新、破棄を行う Operation
  - name: Users
    description: 認証済み User 自身を扱う Operation
  - name: Guilds
    description: User が参加する Guild とその設定を扱う Operation
  - name: Channels
    description: Guild 内の Text Channel と Voice Channel を扱う Operation
  - name: Messages
    description: Text Channel 内の Message を扱う Operation
  - name: System
    description: Instance の稼働状態を確認する Operation
paths:
  /auth/password/register:
    post:
      operationId: registerWithPassword
      tags:
        - Authentication
      summary: Password を使用して User Account と Session を作成する
      description: |
        Email Address が登録済みの場合は新しい Account を作成しません。
        作成した Account の Email 所有確認は、別途定義する Verification Flow で行います。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPasswordRequest'
            example:
              email: alice@example.com
              password: <password-with-15-or-more-characters>
              display_name: Alice
      responses:
        '201':
          description: User Account と Aster Session を作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-access-token
                refresh_token: example-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/password/login:
    post:
      operationId: createPasswordSession
      tags:
        - Authentication
      summary: Email Address と Password で Session を作成する
      description: |
        Account の存在を推測できないよう、Email Address と Password のどちらが一致しない場合も
        同じ `INVALID_CREDENTIALS` Error を返します。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPasswordRequest'
            example:
              email: alice@example.com
              password: <password-with-15-or-more-characters>
      responses:
        '200':
          description: Aster Session を作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-access-token
                refresh_token: example-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/google/authorize:
    post:
      operationId: beginGoogleAuthorization
      tags:
        - Authentication
      summary: Google Loginを開始する
      description: |
        Desktop Clientが生成したPKCE S256 ChallengeとClient Stateを短時間のLogin試行へ保存し、
        System Browserで開くGoogle Authorization URLを返します。
        ServerはGoogle向けのOAuth StateとOpenID Connect Nonceを別に生成し、Clientへ秘密情報を返しません。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthorizationRequest'
            example:
              redirect_uri: aster://auth/callback
              code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
              code_challenge_method: S256
              client_state: yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
      responses:
        '200':
          description: Google Authorization URLを作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthorizationResponse'
              example:
                authorization_url: https://accounts.google.com/o/oauth2/v2/auth?client_id=example&response_type=code
                expires_in: 300
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/google/callback:
    get:
      operationId: completeGoogleAuthorization
      tags:
        - Authentication
      summary: GoogleからのAuthorization Callbackを処理する
      description: |
        Googleが呼び出すServer側Callbackです。ServerはOAuth State、OpenID Connect Nonce、Issuer、
        Audience、署名を検証します。成功時は短時間かつ一度だけ使用できるAster Exchange Codeと、
        Login開始時のClient Stateだけを`aster://auth/callback`へ302 Redirectします。
        GoogleのAuthorization Code、ID Token、Access Token、Refresh TokenはDeep Linkへ含めません。

        Googleが認証を拒否した場合は`error=access_denied`、Provider処理に失敗した場合は
        `error=provider_error`とClient Stateを許可済みDeep Linkへ返します。
        OAuth Stateを検証できないRequestはRedirectせず、400 Errorを返します。
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Googleが発行したAuthorization Codeです。Server内部でのみ交換します。
          schema:
            type: string
            minLength: 1
            maxLength: 4096
        - name: state
          in: query
          required: true
          description: ServerがGoogle Authorization Requestに設定したOAuth Stateです。
          schema:
            type: string
            minLength: 32
            maxLength: 512
        - name: error
          in: query
          required: false
          description: GoogleがAuthorizationを完了できなかった理由です。
          schema:
            type: string
            maxLength: 256
        - name: error_description
          in: query
          required: false
          description: Googleが返す補足情報です。Deep Linkへそのまま転送しません。
          schema:
            type: string
            maxLength: 1024
      responses:
        '302':
          description: 許可済みAster Desktop Deep Linkへ認証結果をRedirectします。
          headers:
            Location:
              required: true
              description: Exchange Codeまたは安全なError CodeとClient Stateを含むAster Deep Linkです。
              schema:
                type: string
                pattern: ^aster://auth/callback\?
              examples:
                success:
                  value: aster://auth/callback?code=example-one-time-aster-exchange-code&state=yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
                denied:
                  value: aster://auth/callback?error=access_denied&state=yxE4J7vB63qQj8VWfKE7i3wmMl7E2kY5gD0hT2uS9_A
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          description: OAuth Stateが無効、失効済み、またはCallback Parameterの組み合わせが不正です。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_OAUTH_CALLBACK
                message: OAuth callback is invalid or expired
                request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        default:
          $ref: '#/components/responses/Error'
  /auth/google/exchange:
    post:
      operationId: exchangeGoogleAuthorization
      tags:
        - Authentication
      summary: Google認証結果をAster Sessionへ交換する
      description: |
        Callback Deep Linkで受け取ったAster Exchange Codeと、Login開始時に生成したPKCE Verifierを交換します。
        Exchange Codeは一度だけ使用でき、成功・失敗を問わず再利用できません。
        GoogleのTokenはServer側に留まり、ResponseはProvider非依存のAster Session Tokenだけを返します。

        Google Identityが未Linkで、同じ確認済みEmail Addressを持つ既存Accountがある場合は自動Linkせず、
        `ACCOUNT_LINK_REQUIRED`を返します。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleExchangeRequest'
            example:
              exchange_code: example-one-time-aster-exchange-code
              code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        '200':
          description: Google Identityを確認し、Aster Sessionを作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-access-token
                refresh_token: example-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '400':
          $ref: '#/components/responses/InvalidAuthorizationGrant'
        '409':
          $ref: '#/components/responses/AccountLinkRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/token/refresh:
    post:
      operationId: refreshSession
      tags:
        - Authentication
      summary: Refresh Token を使用して Session を更新する
      description: |
        成功時は新しい Access Token と Refresh Token を発行し、使用済みの Refresh Token を無効化します。
        使用済み Token の再利用を検知した場合は、同じ Session の Token Family を無効化できます。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            example:
              refresh_token: example-refresh-token
      responses:
        '200':
          description: Aster Session を更新しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
              example:
                access_token: example-next-access-token
                refresh_token: example-next-refresh-token
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
                session_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
        '401':
          $ref: '#/components/responses/InvalidRefreshToken'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: deleteCurrentSession
      tags:
        - Authentication
      summary: 現在の Aster Session を破棄する
      description: |
        Bearer Access Token が示す Session と、Request の Refresh Token が同じ Session に属する場合に破棄します。
        破棄後は、その Session から派生した Access Token と Refresh Token を再利用できません。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            example:
              refresh_token: example-refresh-token
      responses:
        '204':
          description: Aster Session を破棄しました。Response Body はありません。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /users/@me:
    get:
      operationId: getCurrentUser
      tags:
        - Users
      summary: 認証済み User 自身の Account 情報を取得する
      description: |
        Bearer Access Token が示す User の公開 Profile と認証状態を返します。
        外部 Provider の Subject や Token は返しません。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 認証済み User の Account 情報です。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
              example:
                id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
                email: alice@example.com
                email_verified: false
                display_name: Alice
                avatar_url: null
                authentication_methods:
                  - PASSWORD
                created_at: '2026-08-17T06:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /guilds:
    get:
      operationId: listCurrentUserGuilds
      tags:
        - Guilds
      summary: 認証済みUserが参加しているGuildを取得する
      description: |
        ClientのGuild一覧を構成するため、認証済みUserから参照できるGuildだけを返します。
        Cursorがない最初のRequestではServerが定める安定した順序の先頭から取得します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 参加しているGuildのPageです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGuild
      tags:
        - Guilds
      summary: Guildを作成する
      description: |
        認証済みUserをOwnerとするGuildを作成します。
        Default Channelなどの初期Resourceを自動作成するかはServer設定に従います。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuildRequest'
            example:
              name: 星屑コミュニティ
              description: 創作とイベント企画のためのコミュニティ
      responses:
        '201':
          description: Guildを作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /guilds/{guild_id}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: getGuild
      tags:
        - Guilds
      summary: Guildを取得する
      description: 認証済みUserが参照できるGuildの現在の設定を返します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 指定したGuildです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateGuild
      tags:
        - Guilds
      summary: Guildの設定を変更する
      description: Guild設定を変更できる権限を持つUserだけが実行できます。指定していないFieldは変更しません。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuildRequest'
            example:
              name: 星屑クリエイターズ
              description: null
      responses:
        '200':
          description: 変更後のGuildです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGuild
      tags:
        - Guilds
      summary: Guildを削除する
      description: Guildを削除できる権限を持つUserだけが実行できます。削除はGuild配下のResourceにも影響します。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Guildを削除しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /guilds/{guild_id}/channels:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      operationId: listGuildChannels
      tags:
        - Channels
      summary: GuildのChannelを取得する
      description: 認証済みUserが参照できるChannelをpositionの昇順で返します。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Guild内のChannelのPageです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGuildChannel
      tags:
        - Channels
      summary: GuildにChannelを作成する
      description: Channelを管理できる権限を持つUserだけが実行できます。positionはServerが末尾になるよう割り当てます。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
            example:
              type: TEXT
              name: イベント企画
              topic: 次回イベントの日程と内容を相談します
      responses:
        '201':
          description: Channelを作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: getChannel
      tags:
        - Channels
      summary: Channelを取得する
      description: 認証済みUserが参照できるChannelの現在の設定を返します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 指定したChannelです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateChannel
      tags:
        - Channels
      summary: Channelの設定を変更する
      description: Channelを管理できる権限を持つUserだけが実行できます。Channel Typeは作成後に変更できません。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
            example:
              name: 秋のイベント企画
              position: 3
      responses:
        '200':
          description: 変更後のChannelです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteChannel
      tags:
        - Channels
      summary: Channelを削除する
      description: Channelを管理できる権限を持つUserだけが実行できます。Text Channelの削除は配下のMessageにも影響します。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Channelを削除しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: listChannelMessages
      tags:
        - Messages
      summary: Text ChannelのMessageを取得する
      description: |
        認証済みUserが参照できるMessageをcreated_atとidの新しい順で返します。
        next_cursorは現在のPageより古いMessageを取得するために使用します。
        Voice Channelを指定した場合はResourceが見つからないものとして扱います。
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Text Channel内のMessageのPageです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChannelMessage
      tags:
        - Messages
      summary: Text ChannelにMessageを投稿する
      description: |
        Messageを送信できる権限を持つUserをauthorとして、新しいMessageを作成します。
        reply_to_message_idを指定すると、同じText Channel内の参照可能なMessageへの返信として作成します。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
            example:
              content: 10月24日で進める方向でよいでしょうか？
              reply_to_message_id: 0198b8f0-1b72-73a2-a2ef-75cf3cd276d8
      responses:
        '201':
          description: Messageを作成しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel_id}/typing:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      operationId: startChannelTyping
      tags:
        - Channels
      summary: Text Channelで入力開始を通知する
      description: |
        認証済みUserがText Channelへ入力中であることを、Gatewayを通じて同じGuildの接続へ通知します。
        Clientは入力が続く間だけ定期的に呼び出し、Messageを保存する用途には使用しません。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 入力開始の通知を受け付けました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel_id}/messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
    get:
      operationId: getChannelMessage
      tags:
        - Messages
      summary: Text ChannelのMessageを取得する
      description: Messageが指定したText Channelに属し、認証済みUserから参照できる場合だけ返します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 指定したMessageです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateChannelMessage
      tags:
        - Messages
      summary: 自分のMessage本文を変更する
      description: Messageのauthorだけが本文を変更できます。変更時にedited_atをServer時刻へ更新します。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
            example:
              content: 10月24日（土）で進める方向でよいでしょうか？
      responses:
        '200':
          description: 変更後のMessageです。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteChannelMessage
      tags:
        - Messages
      summary: Messageを削除する
      description: Messageのauthor、またはMessageを管理できる権限を持つUserだけが実行できます。
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Messageを削除しました。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /channels/{channel_id}/messages/{message_id}/reactions/{emoji}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/ReactionEmoji'
    put:
      operationId: addMessageReaction
      tags:
        - Messages
      summary: MessageにReactionを付ける
      description: |
        同じUserが同じ絵文字を複数回付けても1件として扱います。
        Messageが指定したText Channelに属し、認証済みUserから参照できる場合だけ更新します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 追加後のReaction集計です。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReaction'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMessageReaction
      tags:
        - Messages
      summary: Messageから自分のReactionを外す
      description: |
        Reactionが付いていない場合も成功として扱い、現在の集計を返します。
        Messageが指定したText Channelに属し、認証済みUserから参照できる場合だけ更新します。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 解除後のReaction集計です。最後の1件を外した場合はcountが0になります。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReaction'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
  /health:
    get:
      operationId: getHealth
      tags:
        - System
      summary: Instance の稼働状態を取得する
      description: |
        HTTP Server が Request を処理できる状態か確認します。
        PostgreSQL などの依存サービスを含む Readiness Check は別の Operation で定義します。
      security: []
      responses:
        '200':
          description: HTTP Server は Request を処理できます。
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/RateLimitBucket'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                version: 0.1.0
                time: '2026-08-17T06:00:00Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Aster Server が発行する不透明な Access Token です。
        Google など外部 Provider の Token は指定しません。
  headers:
    RateLimitBucket:
      description: 同じ Rate Limit を共有する Operation 群の不透明な識別子です。
      required: true
      schema:
        type: string
        minLength: 1
      example: channel-message-write
    RateLimitLimit:
      description: 現在の Bucket で許可される Request 数です。
      required: true
      schema:
        type: integer
        minimum: 1
      example: 5
    RateLimitRemaining:
      description: 現在の Window で残っている Request 数です。
      required: true
      schema:
        type: integer
        minimum: 0
      example: 0
    RateLimitReset:
      description: 現在の Window が終了する Unix Timestamp（秒）です。
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1786946402
    RequestId:
      description: Request を追跡するために Server が割り当てた識別子です。
      required: true
      schema:
        $ref: '#/components/schemas/RequestId'
      example: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    RetryAfter:
      description: Request を再試行できるまでの秒数です。
      required: true
      schema:
        type: integer
        minimum: 0
      example: 2
  parameters:
    ChannelId:
      name: channel_id
      in: path
      required: true
      description: 操作対象の Channel ID です。
      schema:
        $ref: '#/components/schemas/UUID'
      example: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        前の Response が返した次ページ用 Cursor です。
        Cursor は不透明な値として扱い、Client は内容を解析または変更しません。
      schema:
        $ref: '#/components/schemas/PaginationCursor'
      example: eyJpZCI6IjAxOThiOGYwLTJkNmUtN2M0NS05YTNmLTkyZTNmMmYzYzFhMCJ9
    GuildId:
      name: guild_id
      in: path
      required: true
      description: 操作対象の Guild ID です。
      schema:
        $ref: '#/components/schemas/UUID'
      example: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    Limit:
      name: limit
      in: query
      required: false
      description: 1回の Response で取得する最大件数です。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50
    MessageId:
      name: message_id
      in: path
      required: true
      description: 操作対象の Message ID です。
      schema:
        $ref: '#/components/schemas/UUID'
      example: 0198b8f2-4f80-7e67-b250-b4051415e3c2
    ReactionEmoji:
      name: emoji
      in: path
      required: true
      description: URL EncodingしたUnicode絵文字です。初期VersionではCustom Emojiを受け付けません。
      schema:
        $ref: '#/components/schemas/ReactionEmoji'
      example: 👍
  responses:
    EmailAlreadyRegistered:
      description: 指定された Email Address は登録済みです。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: EMAIL_ALREADY_REGISTERED
            message: Email is already registered
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    AccountLinkRequired:
      description: 確認済みEmail Addressが既存Accountで使用されているため、自動Linkや新規Account作成を行いませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ACCOUNT_LINK_REQUIRED
            message: Sign in to the existing account before linking Google
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    Error:
      description: Request を完了できませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Internal server error
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    Forbidden:
      description: 認証済み User にこの操作を行う権限がありません。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have permission to perform this operation
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    InvalidCredentials:
      description: Email Address または Password が一致しないため Session を作成しませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_CREDENTIALS
            message: Email or password is incorrect
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    InvalidAuthorizationGrant:
      description: Exchange Codeが無効、失効済み、使用済み、またはPKCE検証に失敗したためSessionを作成しませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_AUTHORIZATION_GRANT
            message: Authorization grant is invalid or expired
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    InvalidRefreshToken:
      description: Refresh Token が無効または失効済みのため Session を更新しませんでした。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REFRESH_TOKEN
            message: Refresh token is invalid or expired
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    RateLimited:
      description: Rate Limit を超えたため Request を処理しませんでした。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        X-RateLimit-Bucket:
          $ref: '#/components/headers/RateLimitBucket'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
          example:
            code: RATE_LIMITED
            message: Too many requests
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
            details:
              retry_after_ms: 1250
    ResourceNotFound:
      description: 指定した Resource が存在しないか、認証済み User から参照できません。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Resource not found
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
    Unauthorized:
      description: 有効な Aster Access Token がないため Request を認可しませんでした。
      headers:
        WWW-Authenticate:
          description: Bearer 認証が必要であることを示します。
          schema:
            type: string
          example: Bearer
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication is required
            request_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
  schemas:
    AccessToken:
      title: AccessToken
      description: Aster API の認可に使用する、短時間有効な不透明 Token です。
      type: string
      minLength: 1
      maxLength: 4096
      examples:
        - example-access-token
    AuthenticationMethod:
      title: AuthenticationMethod
      description: User Account に Link された認証方法です。
      type: string
      enum:
        - PASSWORD
        - GOOGLE
      x-enum-varnames:
        - Password
        - Google
      examples:
        - PASSWORD
    Channel:
      title: Channel
      description: Guild内のText ChannelまたはVoice Channelです。
      type: object
      additionalProperties: false
      required:
        - id
        - guild_id
        - type
        - name
        - topic
        - position
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        guild_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Channelが属するGuild IDです。
        type:
          $ref: '#/components/schemas/ChannelType'
        name:
          type: string
          minLength: 1
          maxLength: 100
        topic:
          description: Text Channelの説明です。未設定またはVoice Channelの場合はnullです。
          oneOf:
            - type: string
              maxLength: 1024
            - type: 'null'
        position:
          type: integer
          minimum: 0
          description: 同じGuild内での表示順です。小さい値を先に表示します。
        created_at:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
          guild_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
          type: TEXT
          name: イベント企画
          topic: 次回イベントの日程と内容を相談します
          position: 2
          created_at: '2026-08-17T06:05:00Z'
    ChannelList:
      title: ChannelList
      description: Guild内のChannelをpositionの昇順で返すPageです。
      type: object
      additionalProperties: false
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        page:
          $ref: '#/components/schemas/PageInfo'
      examples:
        - items:
            - id: 0198b8f1-3e7f-7d56-a14f-a3f40304d2b1
              guild_id: 0198b8f0-2d6e-7c45-9a3f-92e3f2f3c1a0
              type: TEXT
              name: イベント企画
              topic: 次回イベントの日程と内容を相談します
              position: 2
              created_at: '2026-08-17T06:05:00Z'
          page:
            has_more: false
            next_cursor: null
    ChannelType:
      title: ChannelType
      description: Channelで扱うCommunicationの種類です。
      type: string
      enum:
        - TEXT
        - VOICE
      examples:
        - TEXT
    CreateChannelRequest:
      title: CreateChannelRequest
      description: Guild内に新しいChannelを作成するときの設定です。
      type: object
      additionalProperties: false
      required:
        - type
        - name
      properties:
        type:
          $ref: '#/components/schemas/ChannelType'
        name:
          type: string
          minLength: 1
          maxLength: 100
        topic:
          type: string
          maxLength: 1024
      examples:
        - type: TEXT
          name: イベント企画
          topic: 次回イベントの日程と内容を相談します
    CreateGuildRequest:
      title: CreateGuildRequest
      description: 新しいGuildを作成するときの設定です。
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1024
      examples:
        - name: 星屑コミュニティ
          description: 創作とイベント企画のためのコミュニティ
    CreateMessageRequest:
      title: CreateMessageRequest
      description: Text Channelへ投稿するMessage本文です。
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        reply_to_message_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: |
            同じText Channel内で返信するMessage IDです。
            指定したMessageが存在しない、同じChannelに属さない、または参照できない場合は404を返します。
      examples:
        - content: 10月24日で進める方向でよいでしょうか？
          reply_to_message_id: 0198b8f0-1b72-73a2-a2ef-75cf3cd276d8
    Email:
      title: Email
      description: Login と通知に使用する Email Address です。比較時の正規化は Server が行います。
      type: string
      format: email
      maxLength: 320
      examples:
        - alice@example.com
    AsterExchangeCode:
      title: AsterExchangeCode
      description: Google認証後にAster Serverが発行する、短時間かつ一度だけ使用できる不透明なCodeです。
      type: string
      minLength: 32
      maxLength: 512
      examples:
        - example-one-time-aster-exchange-code
    Error:
      title: Error
      description: API Error の共通形式です。
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          description: Client が分岐に利用する機械可読な Error Code です。
          pattern: ^[A-Z][A-Z0-9_]*$
          examples:
            - INTERNAL_ERROR
        message:
          type: string
          description: 開発者が原因を把握するための説明です。
          minLength: 1
          examples:
            - Internal server error
        request_id:
          $ref: '#/components/schemas/RequestId'
        details:
          type: object
          description: Error Code ごとに定義される追加情報です。
          additionalProperties: true
    HealthResponse:
      title: HealthResponse
      description: HTTP Server の稼働状態です。
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - time
      properties:
        status:
          type: string
          const: ok
          description: HTTP Server が稼働している場合は `ok` です。
        version:
          type: string
          description: 稼働中の Aster Server Version です。
          minLength: 1
          examples:
            - 0.1.0
        time:
          $ref: '#/components/schemas/Timestamp'
    GoogleAuthorizationRequest:
      title: GoogleAuthorizationRequest
      description: Google Loginを開始するDesktop ClientのPKCE情報です。
      type: object
      additionalProperties: false
      required:
        - redirect_uri
        - code_challenge
        - code_challenge_method
        - client_state
      properties:
